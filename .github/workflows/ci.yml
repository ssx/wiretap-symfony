name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, opentelemetry
          coverage: none

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts symfony/flex
          for attempt in 1 2 3; do composer update --prefer-dist --no-interaction --no-progress && break || { [ "$attempt" = 3 ] && exit 1; echo "composer failed, retrying in 15s"; sleep 15; }; done

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none

      - name: Install dependencies
        run: for attempt in 1 2 3; do composer update --prefer-dist --no-interaction --no-progress && break || { [ "$attempt" = 3 ] && exit 1; echo "composer failed, retrying in 15s"; sleep 15; }; done

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
